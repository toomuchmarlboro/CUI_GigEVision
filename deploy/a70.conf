# /etc/a70.conf — options for `a70_cli serve --config /etc/a70.conf`
# Same names as the command-line options (without the leading --). Command line wins.

# --- camera
backend = aravis
# device = 192.168.10.50
irformat = TemperatureLinear10mK
# fps = 30
# range = -20C to 175C
# nuc

# --- object parameters (applied on every (re)connect; set from your survey)
emissivity = 0.93
reflected = 30
atmospheric = 30
distance = 4
# humidity = 0.75

# --- measurement tools: [NAME,]x0,y0,x1,y1[,alarm °C]   /  [NAME,]x,y[,alarm °C]
box = CUI-A,160,230,290,325,45
box = REF-DRY,330,230,420,325
spot = FLANGE,470,250

# --- storage
out = /var/lib/a70/captures
prefix = PIPE-101
interval = 300          # radiometric snapshot + CSV log every 5 min
min-free-mb = 1000

# --- Modbus TCP (bind to the control-network interface only)
modbus-bind = 0.0.0.0
modbus-port = 502
